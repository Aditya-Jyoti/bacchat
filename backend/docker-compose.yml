services:
  bacchat-cloud:
    build: .
    image: bacchat-cloud:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      STORAGE_CAP_BYTES: ${STORAGE_CAP_BYTES:-524288000}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-10485760}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-10}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bacchat-data:/data

volumes:
  bacchat-data:

# Bacchat Cloud on its own server, with HTTPS.
#
# Caddy fetches and renews a Let's Encrypt certificate for BACCHAT_DOMAIN and forwards to the
# service, which is not exposed directly. Point the domain's DNS A/AAAA record at this server and
# open ports 80 and 443 first, then:
#
#   cp .env.example .env      # set BACCHAT_DOMAIN (and the limits, if you like)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# In the app: You > Backup & sync > Bacchat Cloud, address https://<your domain>.
services:
  bacchat-cloud:
    build: .
    image: bacchat-cloud:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DATA_DIR: /data
      STORAGE_CAP_BYTES: ${STORAGE_CAP_BYTES:-524288000}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES:-10485760}
      MAX_DEVICES_PER_ACCOUNT: ${MAX_DEVICES_PER_ACCOUNT:-20}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-10}
      # Behind Caddy, so client IPs come from X-Forwarded-For.
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bacchat-data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      bacchat-cloud:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BACCHAT_DOMAIN: ${BACCHAT_DOMAIN:?Set BACCHAT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bacchat-data:
  caddy-data:
  caddy-config:

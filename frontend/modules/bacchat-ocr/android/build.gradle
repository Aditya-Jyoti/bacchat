plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.bacchat.ocr'
version = '0.1.0'

android {
  namespace "expo.modules.bacchatocr"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bundled Latin text model: runs fully on the device, works offline.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
